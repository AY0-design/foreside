# Full data sync: FPL + Understat → data/snapshot.json, then redeploy.
# FPL itself is already live on the site (src/lib/data/live.ts); this keeps the Understat side
# (zones, xG history) fresh and moves the baseline forward.
name: Sync data

on:
  schedule:
    - cron: "15 5 * * *" # daily, 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Job level so the deploy step's `if` can see whether it is set.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Understat match files never change once played, so keep them between runs.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: understat-${{ github.run_id }}
          restore-keys: understat-

      - run: npm ci

      - run: npm run sync

      # The real-data tests double as a sanity gate: 20 clubs, measured zones for regular
      # starters, plausible projections. A bad sync stops here and is never committed.
      - run: npx vitest run

      - name: Commit the new snapshot
        id: commit
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Sync data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploys when a VERCEL_TOKEN secret is set. (If the Vercel project is connected to this
      # repo instead, the push above deploys on its own and this step can be left unset.)
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: team_QR55IaHSQf303iFbSIhyr9qM
          VERCEL_PROJECT_ID: prj_85aN04mX94zgLyAJo5TGVkDXgeAU
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
